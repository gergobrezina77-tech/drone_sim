[project]
name = "drone-sim"
version = "0.1.0"
description = "Quadrotor swarm simulator on MuJoCo: geometric control, formations, boids, wind and Gymnasium envs"
authors = [
    {name = "gergobrezina",email = "gergo.brezina77@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco (>=3.16.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "gymnasium (>=1.4.0,<2.0.0)",
    "imageio[ffmpeg] (>=2.38.1,<3.0.0)"
]

[project.scripts]
drone-swarm = "drone_sim.cli:swarm"
drone-record = "drone_sim.cli:record"
drone-random = "drone_sim.cli:random_agent"

[tool.poetry]
packages = [{include = "drone_sim", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "import-linter (>=2.15,<3.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance regression guards (run by default; deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120

[tool.importlinter]
root_package = "drone_sim"

# Layer architecture (see docs/ARCHITECTURE.md). Higher layers may import lower ones, never the reverse.
# Layers on the same line separated by "|" are independent siblings and may not import each other.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "drone_sim.api",
    "drone_sim.engine",
    "drone_sim.physics | drone_sim.environment | drone_sim.autonomy | drone_sim.tasks",
    "drone_sim.world",
    "drone_sim.vehicle",
    "drone_sim.core",
]
