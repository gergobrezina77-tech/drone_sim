[project]
name = "drone-sim"
version = "0.1.0"
description = "Quadrotor swarm simulator on MuJoCo: geometric control, formations, boids, wind and Gymnasium envs"
authors = [
    {name = "gergobrezina",email = "gergo.brezina77@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco (>=3.16.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "gymnasium (>=1.4.0,<2.0.0)",
    "imageio[ffmpeg] (>=2.38.1,<3.0.0)"
]

[project.scripts]
drone-swarm = "drone_sim.cli:swarm"
drone-record = "drone_sim.cli:record"
drone-random = "drone_sim.cli:random_agent"

[tool.poetry]
packages = [{include = "drone_sim", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
